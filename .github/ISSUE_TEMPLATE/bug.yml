name: Bug
description: 버그 제보와 수정 작업
title: '[Fix] '
body:
  - type: textarea
    id: current_behavior
    attributes:
      label: 🚨 현재 동작
      description: 실제로 발생한 문제를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: ✨ 기대 동작
      description: 정상적으로 동작할 때의 결과를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 👣 재현 방법
      description: 버그를 다시 확인할 수 있는 순서를 작성해 주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: 📸 로그 / 스크린샷
      description: 관련 로그나 화면 캡처가 있으면 첨부해 주세요.
    validations:
      required: false
