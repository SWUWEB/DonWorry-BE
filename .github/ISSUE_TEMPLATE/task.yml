name: Task
description: 기능/리팩토링/문서/테스트/CI/설정 작업
labels: ['task']
body:
  - type: markdown
    attributes:
      value: |
        제목은 브랜치 타입에 맞는 접두사로 시작해 주세요.
        `feat` → `[Feature]`, `fix` → `[Fix]`, `refactor` → `[Refactor]`, `docs` → `[Docs]`,
        `test` → `[Test]`, `chore` → `[Chore]`, `ci` → `[CI]`, `hotfix` → `[Hotfix]`

  - type: dropdown
    id: branch_type
    attributes:
      label: 🌿 브랜치 타입
      options:
        - feat
        - fix
        - refactor
        - docs
        - chore
        - test
        - ci
        - hotfix
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 📝 작업 요약
      placeholder: 무엇을 왜 하는지 간결하게 작성
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: ✅ 작업 항목
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 🚩 완료 조건
      placeholder: 완료 기준을 작성
    validations:
      required: true
