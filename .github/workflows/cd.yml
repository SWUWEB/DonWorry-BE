name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: donworry
  REGION: asia-northeast3
  SERVICE_NAME: donworry-api
  MIGRATION_JOB_NAME: donworry-migrate
  RUNTIME_SERVICE_ACCOUNT: donworry-run@donworry.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-actions-deploy@donworry.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: donworry-api
  CLOUD_SQL_INSTANCE: donworry:asia-northeast3:donworry-mysql

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/61976702501/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build container image
        run: |
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --pack="image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Create or update migration job
        run: |
          if gcloud run jobs describe "${MIGRATION_JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" >/dev/null 2>&1; then

            gcloud run jobs update "${MIGRATION_JOB_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
              --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
              --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
              --set-secrets="DATABASE_URL=donworry-database-url:latest" \
              --command="/cnb/process/migrate" \
              --args=""
          else
            gcloud run jobs create "${MIGRATION_JOB_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
              --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
              --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
              --set-secrets="DATABASE_URL=donworry-database-url:latest" \
              --command="/cnb/process/migrate" \
              --args=""
          fi

      - name: Run Prisma migrations
        run: |
          gcloud run jobs execute "${MIGRATION_JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}"

      - name: Check deployed API health
        run: |
          service_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"

          if [[ -z "${service_url}" ]]; then
            echo "::error::Cloud Run service URL could not be determined."
            exit 1
          fi

          health_url="${service_url%/}/health"
          auth_header=()
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 5 --max-time 10 \
              "${auth_header[@]}" \
              "${health_url}")" || status="000"

            if [[ "${status}" == "200" ]]; then
              echo "Health check passed: ${health_url} returned HTTP 200."
              exit 0
            fi

            echo "Health check attempt ${attempt}/12 returned HTTP ${status}."
            if [[ "${status}" == "401" || "${status}" == "403" ]] && [[ "${#auth_header[@]}" -eq 0 ]]; then
              id_token="$(gcloud auth print-identity-token --audiences="${service_url}")" || {
                echo "::error::Could not obtain an ID token for the private Cloud Run service."
                exit 1
              }
              auth_header=(--header "Authorization: Bearer ${id_token}")
              echo "Retrying health check with a Cloud Run ID token."
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 5
            fi
          done

          echo "::error::Health check failed after 12 attempts: ${health_url} did not return HTTP 200."
          exit 1
