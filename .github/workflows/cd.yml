name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/swuweb/donworry-be

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.health.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_lightsail
          chmod 600 ~/.ssh/id_lightsail
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_USER: ${{ vars.LIGHTSAIL_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_lightsail "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
            'mkdir -p ~/donworry/deploy'
          scp -i ~/.ssh/id_lightsail \
            deploy/compose.production.yml \
            deploy/Caddyfile \
            deploy/deploy.sh \
            deploy/backup-db.sh \
            deploy/verify.sh \
            "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}:~/donworry/deploy/"

      - name: Deploy application
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_USER: ${{ vars.LIGHTSAIL_SSH_USER }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_lightsail \
            "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/id_lightsail "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
            "chmod +x ~/donworry/deploy/deploy.sh ~/donworry/deploy/backup-db.sh \
            ~/donworry/deploy/verify.sh && \
            ~/donworry/deploy/deploy.sh \
            '${IMAGE_NAME}:${GITHUB_SHA}' '${PRODUCTION_URL}'"

      - name: Remove registry credentials from server
        if: always()
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_USER: ${{ vars.LIGHTSAIL_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_lightsail "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
            'docker logout ghcr.io' || true

      - name: Publish deployment URL
        id: health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          echo "url=${PRODUCTION_URL}" >> "${GITHUB_OUTPUT}"
