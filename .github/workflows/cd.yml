name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: donworry
  REGION: asia-northeast3
  SERVICE_NAME: donworry-api
  MIGRATION_JOB_NAME: donworry-migrate
  RUNTIME_SERVICE_ACCOUNT: donworry-run@donworry.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-actions-deploy@donworry.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: donworry-api
  CLOUD_SQL_INSTANCE: donworry:asia-northeast3:donworry-mysql

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/61976702501/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build container image
        run: |
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --pack="image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Create or update migration job
        run: |
          if gcloud run jobs describe "${MIGRATION_JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" >/dev/null 2>&1; then

            gcloud run jobs update "${MIGRATION_JOB_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
              --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
              --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
              --set-secrets="DATABASE_URL=donworry-database-url:latest" \
              --command="npx" \
              --args="prisma,migrate,deploy"
          else
            gcloud run jobs create "${MIGRATION_JOB_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
              --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
              --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
              --set-secrets="DATABASE_URL=donworry-database-url:latest" \
              --command="npx" \
              --args="prisma,migrate,deploy"
          fi

      - name: Run Prisma migrations
        run: |
          gcloud run jobs execute "${MIGRATION_JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}"
