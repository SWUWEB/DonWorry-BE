services:
  mysql:
    image: mysql:8.4
    container_name: donworry-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: donworry
      MYSQL_USER: donworry
      MYSQL_PASSWORD: donworry
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
